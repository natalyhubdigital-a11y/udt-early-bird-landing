<style>
  :root {
    --navy: #1C203D;
    --navy-2: #252a4a;
    --gold: #D3AF37;
    --gold-deep: #b8952a;
    --cream: #F7F5EF;
    --white: #ffffff;
    --muted: #9aa0bd;
    --line: rgba(255, 255, 255, .14);
    --font-sans: 'Montserrat', ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    background: var(--navy);
    color: #ffffff;
    font-family: var(--font-sans);
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Header ---------- */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 24px;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    border-bottom: 1px solid var(--line);
  }

  .ghost-btn {
    background: transparent;
    border: 1.5px solid rgba(255,255,255,.4);
    color: #fff;
    border-radius: 9999px;
    padding: 8px 18px;
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: border-color 0.2s cubic-bezier(0.625,0.05,0,1), background 0.2s;
    visibility: hidden;
  }
  .ghost-btn.show { visibility: visible; }
  .ghost-btn:hover { border-color: var(--gold); background: rgba(255,255,255,.06); }

  .brand-block {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-logo-mini {
    height: 32px;
    width: auto;
    display: block;
  }

  .brand-text .name {
    font-size: 13px;
    font-weight: 700;
    color: #ffffff;
    line-height: 1.2;
  }
  .brand-text .sub {
    font-size: 11px;
    color: var(--gold);
    font-weight: 600;
    line-height: 1.2;
  }

  .top-bar-right { width: 90px; }

  /* ---------- Intro ---------- */
  .intro {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 24px 80px;
  }

  .intro-inner {
    max-width: 560px;
    text-align: center;
  }

  .eyebrow {
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold);
    margin: 0 0 24px;
  }

  .display-heading {
    font-family: var(--font-sans);
    font-weight: 800;
    font-size: clamp(32px, 6vw, 54px);
    line-height: 1.15;
    letter-spacing: -0.025em;
    margin: 0 0 28px;
  }

  .display-heading em {
    font-style: normal;
    font-weight: 800;
    color: var(--gold);
  }

  .intro p.lede {
    font-size: 16px;
    line-height: 1.6;
    color: var(--muted);
    max-width: 46ch;
    margin: 0 auto 40px;
  }

  .pill-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--gold);
    color: var(--navy);
    border: none;
    border-radius: 9999px;
    padding: 14px 28px;
    font-family: var(--font-sans);
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: rgba(28,32,61,0.15) 0px 4px 20px 0px;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
  }
  .pill-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 26px rgba(211, 175, 55, .35); background: #e0bd45; }
  .pill-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  /* ---------- Chat ---------- */
  .chat-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 0 20px;
  }

  .progress-track {
    height: 2px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .progress-fill {
    height: 100%;
    background: var(--gold);
    transition: width 0.4s cubic-bezier(0.625,0.05,0,1);
  }

  .chat-log {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 24px 0;
  }

  .msg-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
  }
  .msg-row.bot { justify-content: flex-start; }
  .msg-row.user { justify-content: flex-end; }

  .msg-icon {
    width: 26px; height: 26px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 600;
  }
  .msg-row.bot .msg-icon { background: var(--navy-2); color: var(--gold); border: 1px solid var(--line); }
  .msg-row.user .msg-icon { background: var(--gold); color: var(--navy); }

  .bubble {
    max-width: 74%;
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.5;
  }
  .msg-row.bot .bubble {
    background: var(--navy-2);
    color: #ffffff;
    border: 1px solid var(--line);
    border-bottom-left-radius: 4px;
  }
  .msg-row.user .bubble {
    background: var(--cream);
    color: var(--navy);
    border-bottom-right-radius: 4px;
  }

  .answer-zone {
    padding: 16px 0 28px;
    border-top: 1px solid var(--line);
  }

  .options-grid {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-pill {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--navy-2);
    border: 1.5px solid var(--line);
    border-radius: 9999px;
    padding: 12px 18px;
    color: #ffffff;
    font-family: var(--font-sans);
    font-size: 15px;
    font-weight: 500;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.2s cubic-bezier(0.625,0.05,0,1), background 0.2s;
  }
  .option-pill:hover { border-color: var(--gold); background: #2c325a; }

  .option-pill .num {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: rgba(255,255,255,.1);
    color: var(--gold);
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .text-answer-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
  }

  .text-answer-row textarea {
    flex: 1;
    resize: none;
    background: var(--navy-2);
    border: 1.5px solid var(--line);
    border-radius: 16px;
    color: #ffffff;
    font-family: var(--font-sans);
    font-size: 15px;
    padding: 14px 16px;
    min-height: 52px;
    max-height: 140px;
  }
  .text-answer-row textarea:focus { outline: none; border-color: var(--gold); background: #2c325a; }
  .text-answer-row textarea::placeholder { color: var(--muted); }

  .send-btn {
    width: 46px; height: 46px;
    border-radius: 50%;
    background: var(--gold);
    border: none;
    color: var(--navy);
    font-size: 16px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.18s ease, background 0.18s ease;
  }
  .send-btn:hover:not(:disabled) { background: #e0bd45; }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ---------- Report ---------- */
  .report-wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px 100px;
  }

  .report-header {
    background: var(--cream);
    border-radius: 10px;
    border-top: 4px solid var(--gold);
    padding: 36px 32px;
    margin: 28px 0 8px;
  }
  .report-header .eyebrow { color: var(--gold-deep); margin-bottom: 14px; }
  .report-header .rep-name {
    font-family: var(--font-sans);
    font-weight: 800;
    color: var(--navy);
    font-size: 30px;
    letter-spacing: -0.02em;
    margin: 0 0 6px;
  }
  .report-header .rep-sub {
    font-size: 14px;
    color: #5b6172;
  }

  .report-body { padding: 40px 4px 0; }

  .report-body .display-heading { text-align: left; margin-bottom: 24px; max-width: 22ch; }

  .report-body p.narrative {
    font-size: 16px;
    line-height: 1.7;
    color: #c9ccdd;
    max-width: 64ch;
    margin: 0 0 18px;
  }

  .stat-card {
    background: var(--cream);
    border: 1px solid rgba(28,32,61,.12);
    border-radius: 10px;
    margin: 36px 0;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
  }
  .stat-cell {
    padding: 22px 20px;
    border-right: 1px solid rgba(28,32,61,.12);
  }
  .stat-cell:last-child { border-right: none; }
  .stat-cell .label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #5b6172;
    margin-bottom: 8px;
  }
  .stat-cell .value {
    font-size: 18px;
    font-weight: 800;
    color: var(--navy);
    line-height: 1.25;
  }

  .section-block { margin: 56px 0; }
  .section-num-heading {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 6px;
  }
  .section-num-heading .n {
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 700;
    color: var(--gold);
  }
  .section-num-heading h2 {
    font-family: var(--font-sans);
    font-weight: 800;
    color: #ffffff;
    font-size: 24px;
    margin: 0;
  }
  .section-block > p.section-sub {
    font-size: 14px;
    color: var(--muted);
    margin: 0 0 22px;
  }

  .item-card {
    display: flex;
    gap: 16px;
    background: #ffffff;
    border: 1px solid rgba(28,32,61,.12);
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 10px;
    align-items: flex-start;
  }
  .item-card .idx {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--cream);
    color: var(--navy);
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .item-card .item-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--navy);
    margin: 0 0 4px;
  }
  .item-card .item-desc {
    font-size: 14px;
    color: #5b6172;
    line-height: 1.5;
    margin: 0;
  }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1.5px solid rgba(28,32,61,.12);
    border-radius: 9999px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    color: var(--navy);
    background: #ffffff;
  }

  .victory-box {
    border: 1.5px solid var(--gold);
    background: var(--cream);
    border-radius: 10px;
    padding: 24px 26px;
    font-size: 15px;
    line-height: 1.6;
    color: #3a3f55;
    margin: 40px 0;
  }
  .victory-box strong { color: var(--navy); }

  .closing-cta {
    background: var(--navy-2);
    border-radius: 10px;
    padding: 30px 28px;
    text-align: center;
    margin-top: 20px;
  }
  .closing-cta p { font-size: 15px; color: #c9ccdd; margin: 0 0 20px; }
  .closing-cta .cta-row {
    display: flex; flex-wrap: wrap; gap: 12px; justify-content: center;
  }

  .link-ghost {
    background: transparent;
    border: none;
    color: var(--muted);
    font-family: var(--font-sans);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    margin-top: 18px;
  }
  .link-ghost:hover { color: #ffffff; }

  .disclaimer {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.6;
    max-width: 62ch;
    margin: 32px auto 0;
    text-align: center;
  }

  @media (max-width: 640px) {
    .stat-card { grid-template-columns: repeat(2, 1fr); }
    .stat-cell:nth-child(2) { border-right: none; }
    .stat-cell:nth-child(1), .stat-cell:nth-child(2) { border-bottom: 1px solid rgba(28,32,61,.12); }
    .bubble { max-width: 84%; }
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  @media print {
    .top-bar, .link-ghost, .closing-cta .cta-row { display: none !important; }
    body { background: #fff; color: #111; }
    .report-header, .stat-card, .item-card, .closing-cta { background: #f2f2f2 !important; }
  }
</style>
</head>
<body>

<div class="app" id="app"></div>

<script>
(function () {
  "use strict";

  var STEPS = [
    { id: "nombre", type: "text", bot: "Hola, soy el asistente de ruta de UDT. Antes de empezar, ¿cómo te llamas?", placeholder: "Tu nombre..." },
    { id: "metaLibre", type: "text", bot: null, placeholder: "Cuéntame qué buscas..." },
    { id: "destino", type: "choice", bot: "¿Ya tienes un destino en mente, o prefieres que te ayude a encontrarlo?",
      options: [
        { value: "espana", text: "España" },
        { value: "alemania", text: "Alemania" },
        { value: "canada", text: "Canadá" },
        { value: "reinoUnido", text: "Reino Unido" },
        { value: "noSe", text: "Aún no decido" }
      ] },
    { id: "ingles", type: "choice", bot: "¿Cómo describirías tu inglés hoy?",
      options: [
        { value: "0", text: "Sin evaluar o básico" },
        { value: "1", text: "A2 — básico-intermedio" },
        { value: "2", text: "B1 — intermedio" },
        { value: "3", text: "B2 o más — avanzado" }
      ] },
    { id: "prioridad", type: "choice", bot: "De estas cuatro cosas, ¿cuál pesa más en tu decisión?",
      options: [
        { value: "espana", text: "Cercanía cultural y del idioma" },
        { value: "alemania", text: "Costo de vida accesible y mercado laboral fuerte" },
        { value: "canada", text: "Sistema anglosajón con costo moderado" },
        { value: "reinoUnido", text: "Prestigio académico y trayectoria clara" }
      ] },
    { id: "momento", type: "choice", bot: "¿En qué momento te encuentras?",
      options: [
        { value: "pronto", text: "Quiero decidir en los próximos meses" },
        { value: "esteAño", text: "Este año, sin prisa" },
        { value: "explorando", text: "Explorando para más adelante" }
      ] },
    { id: "dudaLibre", type: "text", bot: null, placeholder: "Cuéntamelo con detalle..." }
  ];

  // El texto de bot para metaLibre y dudaLibre se arma dinámico (usa el nombre / destino ya dados)
  function botTextFor(step, answers) {
    if (step.id === "metaLibre") {
      return "Gracias, " + (answers.nombre || "").split(" ")[0] + ". Cuéntame: ¿qué es lo que más te gustaría resolver — el destino, la universidad, o ambas?";
    }
    if (step.id === "dudaLibre") {
      return "Última cosa — si pudieras resolver UNA sola duda antes de decidir, ¿cuál sería? Cuéntamela con detalle para afinar tu ruta 🙌";
    }
    return step.bot;
  }

  var DEST = {
    espana: { nombre: "España", minIngles: 0, status: "activa",
      instituciones: ["Universidad Europea", "ENAE International Business School", "UCAM"],
      fortaleza: "la cercanía cultural y del idioma, con menos fricción de adaptación desde el día uno",
      earlyBird: { uno: "3,000", dos: "5,300" }, regular: { uno: "3,500", dos: "6,000" } },
    alemania: { nombre: "Alemania", minIngles: 1, status: "activa",
      instituciones: ["EP English Path"],
      fortaleza: "el bajo costo educativo, un mercado laboral fuerte y una puerta directa a la Unión Europea",
      earlyBird: { uno: "3,000", dos: "5,300" }, regular: { uno: "3,500", dos: "6,000" } },
    canada: { nombre: "Canadá", minIngles: 2, status: "proximamente",
      instituciones: ["University Canada West", "Vancouver Community College", "Capilano University"],
      fortaleza: "un sistema anglosajón sólido con un costo de vida moderado frente a otros destinos de habla inglesa" },
    reinoUnido: { nombre: "Reino Unido", minIngles: 3, status: "proximamente",
      instituciones: ["Oxford International Education Group"],
      fortaleza: "el prestigio académico y pathways claros hacia programas reconocidos internacionalmente" }
  };
  var NIVEL_TEXTO = ["sin evaluar / básico", "A2", "B1", "B2 o más"];
  var EARLY_BIRD_DEADLINE = new Date("2026-09-01T00:00:00");

  function scoreDestino(key, a) {
    var d = DEST[key], s = 0;
    if (a.destino === key) s += 6;
    if (a.destino === "noSe") {
      if (a.prioridad === key) s += 4;
      if (a.momento === "pronto" && d.status === "activa") s += 2;
      if (a.momento === "explorando" && d.status === "proximamente") s += 1;
      if (Number(a.ingles) >= d.minIngles) s += 1;
    }
    return s;
  }
  function rankDestinos(a) {
    return Object.keys(DEST).map(function (k) { return { key: k, score: scoreDestino(k, a) }; })
      .sort(function (x, y) { return y.score - x.score; });
  }

  var state = { phase: "intro", stepIndex: 0, answers: {} };
  var app = document.getElementById("app");

  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

  function renderIntro() {
    app.innerHTML =
      '<div class="top-bar"><button class="ghost-btn" id="back"></button>' +
      '<div class="brand-block"><img src="assets/img/logo-udt.png" alt="University Discovery Tours" class="brand-logo-mini"><div class="brand-text"><div class="name">Ruta de Desarrollo</div><div class="sub">UDT · TU GUÍA</div></div></div>' +
      '<div class="top-bar-right"></div></div>' +
      '<div class="intro"><div class="intro-inner">' +
      '<p class="eyebrow">Plan de desarrollo educativo</p>' +
      '<h1 class="display-heading">No decidas tu universidad desde un <em>brochure.</em></h1>' +
      '<p class="lede">Cinco minutos de conversación. Al final tienes tu ruta: destino, instituciones aliadas y próximos pasos — pensada para ti, no una plantilla genérica.</p>' +
      '<button class="pill-btn" id="start">Empezar mi diagnóstico</button>' +
      "</div></div>";
    document.getElementById("start").addEventListener("click", function () {
      state.phase = "chat"; state.stepIndex = 0; state.messages = [];
      renderChat(true);
    });
  }

  function renderChat(pushBotMessage) {
    var step = STEPS[state.stepIndex];
    if (pushBotMessage) {
      state.messages.push({ from: "bot", text: botTextFor(step, state.answers) });
    }

    var pct = Math.round((state.stepIndex / STEPS.length) * 100);

    var html = '<div class="top-bar"><button class="ghost-btn show" id="back">Regresar</button>' +
      '<div class="brand-block"><img src="assets/img/logo-udt.png" alt="University Discovery Tours" class="brand-logo-mini"><div class="brand-text"><div class="name">Ruta de Desarrollo</div><div class="sub">UDT · TU GUÍA</div></div></div>' +
      '<div class="top-bar-right"></div></div>';

    html += '<div class="chat-screen"><div class="progress-track"><div class="progress-fill" style="width:' + pct + '%"></div></div>';
    html += '<div class="chat-log" id="chatLog">';
    state.messages.forEach(function (m) {
      if (m.from === "bot") {
        html += '<div class="msg-row bot"><div class="msg-icon">UDT</div><div class="bubble">' + esc(m.text) + "</div></div>";
      } else {
        html += '<div class="msg-row user"><div class="bubble">' + esc(m.text) + '</div><div class="msg-icon">Tú</div></div>';
      }
    });
    html += "</div>";

    html += '<div class="answer-zone" id="answerZone"></div></div>';

    app.innerHTML = html;

    var chatLog = document.getElementById("chatLog");
    chatLog.scrollTop = chatLog.scrollHeight;

    document.getElementById("back").addEventListener("click", function () {
      if (state.stepIndex === 0) { state.phase = "intro"; renderIntro(); return; }
      state.messages.pop(); // quita la pregunta del bot actual (sin responder)
      state.messages.pop(); // quita la respuesta que el usuario dio al paso anterior
      state.messages.pop(); // quita la pregunta del bot del paso anterior (se vuelve a mostrar)
      state.stepIndex -= 1;
      renderChat(true);
    });

    renderAnswerZone(step);
  }

  function advance(answerText, rawValue) {
    var step = STEPS[state.stepIndex];
    state.answers[step.id] = rawValue;
    state.messages.push({ from: "user", text: answerText });
    state.stepIndex += 1;
    if (state.stepIndex >= STEPS.length) {
      state.phase = "report";
      renderReport();
    } else {
      renderChat(true);
    }
  }

  function renderAnswerZone(step) {
    var zone = document.getElementById("answerZone");
    if (step.type === "choice") {
      var html = '<div class="options-grid">';
      step.options.forEach(function (opt, i) {
        html += '<button class="option-pill" data-value="' + opt.value + '" data-text="' + esc(opt.text) + '"><span class="num">' + (i + 1) + "</span>" + esc(opt.text) + "</button>";
      });
      html += "</div>";
      zone.innerHTML = html;
      zone.querySelectorAll(".option-pill").forEach(function (btn) {
        btn.addEventListener("click", function () {
          advance(btn.getAttribute("data-text"), btn.getAttribute("data-value"));
        });
      });
    } else {
      zone.innerHTML =
        '<div class="text-answer-row"><textarea id="freeText" placeholder="' + esc(step.placeholder) + '" rows="2"></textarea>' +
        '<button class="send-btn" id="sendBtn" disabled>&#8593;</button></div>';
      var ta = document.getElementById("freeText");
      var sendBtn = document.getElementById("sendBtn");
      ta.addEventListener("input", function () { sendBtn.disabled = ta.value.trim().length === 0; });
      ta.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!sendBtn.disabled) doSend(); }
      });
      sendBtn.addEventListener("click", doSend);
      function doSend() {
        var v = ta.value.trim();
        if (!v) return;
        advance(v, v);
      }
      ta.focus();
    }
  }

  function renderReport() {
    var a = state.answers;
    var ranked = rankDestinos(a);
    var mainKey = ranked[0].key, altKey = ranked[1].key;
    var main = DEST[mainKey];
    var ingles = Number(a.ingles);
    var meetsMin = ingles >= main.minIngles;
    var nombre = (a.nombre || "").trim() || "tu";
    var primerNombre = nombre.split(" ")[0];
    var fecha = new Date().toLocaleDateString("es-MX", { day: "numeric", month: "long", year: "numeric" });

    var modalidad = a.momento === "explorando" ? "Tour Virtual" : "Tour Presencial";
    var isEarly = new Date() < EARLY_BIRD_DEADLINE;
    var priceValue = main.status === "activa"
      ? (isEarly ? "$" + main.earlyBird.uno + " USD" : "$" + main.regular.uno + " USD")
      : "Próximamente";

    var html = '<div class="top-bar"><button class="ghost-btn show" id="back">Regresar</button>' +
      '<div class="brand-block"><img src="assets/img/logo-udt.png" alt="University Discovery Tours" class="brand-logo-mini"><div class="brand-text"><div class="name">Ruta de Desarrollo</div><div class="sub">UDT · TU GUÍA</div></div></div>' +
      '<div class="top-bar-right"></div></div>';

    html += '<div class="report-wrap">';

    html += '<div class="report-header"><p class="eyebrow">UDT · PLAN GENERADO</p>' +
      '<p class="rep-name">' + esc(nombre) + '</p>' +
      '<p class="rep-sub">University Discovery Tours · Plan de Desarrollo Educativo · ' + fecha + "</p></div>";

    html += '<div class="report-body">';
    html += '<h1 class="display-heading">Tu ruta hacia <em>' + esc(main.nombre) + ".</em></h1>";

    html += '<p class="narrative">' + esc(primerNombre) + ", dijiste que buscas " + esc(a.metaLibre || "definir tu camino") +
      ". Con lo que me contaste, " + esc(main.nombre) + " es el destino que mejor encaja hoy: destaca por " + main.fortaleza + ".</p>";
    html += '<p class="narrative">Tu problema no es la falta de opciones, es decidir sin haberlas visto. El tour existe para que llegues a tu asesoría con el destino, tu nivel de inglés y el presupuesto ya claros — información real, no folletos.</p>';

    html += '<div class="stat-card">' +
      '<div class="stat-cell"><div class="label">Destino</div><div class="value">' + esc(main.nombre) + "</div></div>" +
      '<div class="stat-cell"><div class="label">Tu inglés</div><div class="value">' + NIVEL_TEXTO[ingles] + "</div></div>" +
      '<div class="stat-cell"><div class="label">Modalidad sugerida</div><div class="value">' + modalidad + "</div></div>" +
      '<div class="stat-cell"><div class="label">' + (main.status === "activa" ? (isEarly ? "Precio early bird" : "Precio") : "Estado") + '</div><div class="value">' + priceValue + "</div></div>" +
      "</div>";

    html += '<div class="section-block"><div class="section-num-heading"><span class="n">01</span><h2>Tu destino</h2></div>' +
      '<p class="section-sub">Por qué encaja con lo que nos contaste.</p>' +
      '<div class="item-card"><div class="idx">→</div><div><p class="item-title">' + esc(main.nombre) + '</p><p class="item-desc">Destaca por ' + main.fortaleza + ".</p></div></div>";
    if (!meetsMin) {
      html += '<div class="item-card"><div class="idx">!</div><div><p class="item-title">Tu inglés hoy</p><p class="item-desc">Tu nivel actual (' + NIVEL_TEXTO[ingles] + ") está por debajo del mínimo sugerido para " + esc(main.nombre) + " (" + NIVEL_TEXTO[main.minIngles] + "). Es un punto de partida claro para trabajar antes del viaje, no una barrera cerrada.</p></div></div>";
    }
    html += "</div>";

    html += '<div class="section-block"><div class="section-num-heading"><span class="n">02</span><h2>Instituciones aliadas</h2></div><div class="chip-row">';
    main.instituciones.forEach(function (inst) { html += '<span class="chip">' + esc(inst) + "</span>"; });
    html += "</div></div>";

    html += '<div class="section-block"><div class="section-num-heading"><span class="n">03</span><h2>Próximos pasos</h2></div>' +
      '<div class="item-card"><div class="idx">1</div><div><p class="item-title">Agenda tu asesoría 1:1</p><p class="item-desc">Resolvemos destino, inglés y financiamiento con calma.</p></div></div>' +
      '<div class="item-card"><div class="idx">2</div><div><p class="item-title">Habla con un asesor por WhatsApp</p><p class="item-desc">Respuesta directa a lo que te quedó pendiente.</p></div></div>' +
      '<div class="item-card"><div class="idx">3</div><div><p class="item-title">Otra opción a considerar: ' + esc(DEST[altKey].nombre) + '</p><p class="item-desc">Destaca por ' + DEST[altKey].fortaleza + ".</p></div></div>" +
      "</div>";

    if (a.dudaLibre) {
      html += '<div class="victory-box"><strong>Tu primera victoria:</strong> cuando resuelvas "' + esc(a.dudaLibre) + '", vas a llegar a tu asesoría con destino, inglés y presupuesto ya claros — para decidir con información, no con folletos.</div>';
    }

    var waText = encodeURIComponent("Hola, acabo de hacer mi diagnóstico en la página de UDT y quiero conversar sobre " + main.nombre + ".");
    html += '<div class="closing-cta"><p>¿Seguimos? Elige cómo prefieres continuar.</p><div class="cta-row">' +
      '<a class="pill-btn" href="https://calendar.app.google/wDjBXsaK9zp3bQdh9" target="_blank" rel="noopener">Agendar asesoría</a>' +
      '<a class="ghost-btn show" style="text-decoration:none; display:inline-flex; align-items:center;" href="https://wa.me/5215613049262?text=' + waText + '" target="_blank" rel="noopener">Escribir por WhatsApp</a>' +
      '<button class="ghost-btn show" id="printBtn" type="button">Guardar como PDF</button>' +
      "</div></div>";

    html += '<p class="disclaimer">Esta guía es orientativa y se genera con las respuestas que diste. No sustituye una asesoría personalizada: precios, fechas, becas y programas confirmados los entrega tu asesor con la información oficial más reciente.</p>';

    html += '<div style="text-align:center;"><button class="link-ghost" id="restart">Empezar de nuevo</button></div>';

    html += "</div></div>";

    app.innerHTML = html;

    document.getElementById("back").addEventListener("click", function () {
      state.messages.pop(); // quita la última respuesta del usuario
      state.messages.pop(); // quita la última pregunta del bot (se vuelve a mostrar)
      state.stepIndex = STEPS.length - 1;
      state.phase = "chat";
      renderChat(true);
    });
    document.getElementById("printBtn").addEventListener("click", function () { window.print(); });
    document.getElementById("restart").addEventListener("click", function () {
      state = { phase: "intro", stepIndex: 0, answers: {} };
      renderIntro();
    });
  }

  renderIntro();
})();
</script>

</body>
</html>
